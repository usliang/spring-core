<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加州 DMV 路考英语听力训练</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6fa;color:#172338;margin:0}main{max-width:720px;margin:24px auto;padding:18px}.panel{background:white;border-radius:18px;padding:24px;box-shadow:0 5px 22px #15274713}h1{font-size:26px}button,select{font:inherit}button{border:0;border-radius:12px;padding:14px 18px;cursor:pointer;background:#1766d1;color:white;font-weight:600}button.secondary{background:#e8eef8;color:#18355c}button.choice{display:block;width:100%;text-align:left;background:#f0f4fa;color:#172338;margin:10px 0;border:2px solid transparent}button.choice.correct{border-color:#168454;background:#e4f7ec}button.choice.wrong{border-color:#cc4343;background:#fff0f0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#607087}.stat{margin:16px 0}.hidden{display:none}.answer{padding:14px;background:#f4f7fb;border-radius:12px;margin:16px 0;line-height:1.7}.foot{font-size:13px;color:#607087;line-height:1.6}select{padding:10px;border-radius:8px;border:1px solid #bbc9d8}button:disabled{opacity:.5;cursor:not-allowed}</style></head><body><main><div class="panel"><h1>🚗 加州 DMV 路考英语听力训练</h1><p class="muted">先听声音，再选择中文意思。答题前不显示英文。支持随机题目、重复播放、错题重练。</p><div class="row"><label>语速 <select id="rate"><option value="0.5">超慢速 0.5×</option><option value="0.75">慢速 0.75×</option><option value="0.9">稍慢 0.9×</option><option value="1" selected>正常 1×</option><option value="1.15">快速 1.15×</option></select></label><label>声音 <select id="voice"><option value="">自动选择美式英语</option></select></label></div><div class="stat" id="stats"></div><div class="row"><button id="speak">🔊 播放英语指令</button><button class="secondary" id="repeat">↻ 再听一次</button></div><p id="hint" class="muted">点击播放按钮，听完后选答案。</p><div id="choices"></div><div id="feedback" class="answer hidden"></div><div class="row"><button id="next" disabled>下一题 →</button><button class="secondary" id="wrongOnly">只练错题</button><button class="secondary" id="restart">重新开始</button></div><p class="foot">使用浏览器内置英文语音朗读功能。建议使用最新版 Chrome、Safari 或 Edge，并打开设备声音。此练习是模拟教学材料，并非 DMV 官方考题或录音。实际考试中必须遵守交通规则，听不清时可请求考官重复。</p></div></main><script>
const data=[
['Turn left.','左转','右转','直行','靠边停车'],['Turn right.','右转','左转','倒车','变道'],['Go straight.','直行','左转','靠边停车','掉头'],['At the next street, turn left.','在下一条街左转','在当前路口右转','向左变道','在停车标志前停车'],['At the traffic light, turn right.','在红绿灯处右转','在停车标志处左转','立即停车','向右变道'],['At the stop sign, turn left.','在停车标志处左转','在红绿灯处右转','保持车道','倒车'],['Continue straight ahead.','继续直行','向右变道','靠边停车','掉头'],['Take the next right.','在下一个路口右转','在下一个路口左转','马上停车','向右变道'],['Change lanes to the left when safe.','安全时向左变道','立即左转','靠左停车','向右变道'],['Change lanes to the right when safe.','安全时向右变道','在下个路口右转','保持左侧车道','向左变道'],['Stay in this lane.','保持当前车道','向左变道','向右变道','停车'],['Move into the right lane.','进入右侧车道','右转进入街道','向右靠边停车','直行'],['Pull over to the right.','靠右停车','右转','向右变道后继续行驶','倒车'],['Pull up next to the curb.','靠路沿停下','在路口掉头','左转','加速'],['Stop here.','在这里停车','在下一条街左转','继续直行','倒车'],['Back up in a straight line.','直线倒车','直线向前行驶','左转','变道'],['Keep backing up.','继续倒车','停止倒车','继续直行','靠边停车'],['Stop backing up.','停止倒车','开始倒车','右转','继续倒车'],['Pull away from the curb when safe.','安全时从路边驶出','立即停车','继续倒车','驶向路沿'],['Return to the DMV.','返回 DMV 考场','开到高速公路','靠边停车','在路口左转'],['Park in the parking lot.','在停车场停车','在路口停车','在高速公路停车','向左变道'],['Show me your left turn signal.','演示左转向灯','演示右转向灯','打开雨刷','按喇叭'],['Show me your right turn signal.','演示右转向灯','演示左转向灯','打开双闪灯','踩刹车'],['Turn on your headlights.','打开前灯','打开雨刷','打开双闪灯','打开空调'],['Turn on your windshield wipers.','打开雨刷','打开前灯','按喇叭','打开车窗'],['Show me the defroster.','指出除雾功能','打开左转向灯','按喇叭','踩刹车'],['Turn on your hazard lights.','打开双闪警示灯','打开前灯','打开雨刷','松开刹车'],['Honk the horn.','按喇叭','踩刹车','打开车窗','倒车'],['Step on the brake pedal.','踩刹车踏板','踩加速踏板','打开雨刷','按喇叭'],['Set the parking brake.','启用驻车制动','松开驻车制动','向右变道','倒车'],['Release the parking brake.','解除驻车制动','启用驻车制动','踩加速踏板','打开前灯'],['Roll down your window.','降下车窗','升起车窗','打开车灯','打开雨刷'],['Show me the hand signal for a left turn.','演示左转手势','演示右转手势','演示停车手势','打开左转向灯'],['Show me the hand signal for a right turn.','演示右转手势','演示左转手势','演示停车手势','打开右转向灯'],['Show me the hand signal for stopping.','演示停车手势','演示左转手势','演示右转手势','踩加速踏板'],['When it is safe, merge into traffic.','安全时汇入车流','立即靠边停车','在路口左转','开始倒车'],['Make a right turn at the intersection.','在交叉路口右转','在交叉路口左转','向右变道','继续直行'],['Check your blind spot.','检查盲区','检查后备箱','打开前灯','检查轮胎'],['Could you please repeat that?','请您再说一遍好吗？','请您左转好吗？','请您停车好吗？','请您开快一点好吗？']];
let order=[],pos=0,answered=false,correct=0,total=0,missed=new Set(),wrongMode=false;const $=id=>document.getElementById(id);function shuffle(a){return a.sort(()=>Math.random()-.5)}function setup(onlyWrong=false){wrongMode=onlyWrong;order=shuffle((onlyWrong?[...missed]:data.map((_,i)=>i)));pos=0;correct=0;total=0;render()}function render(){answered=false;$('feedback').classList.add('hidden');$('next').disabled=true;$('choices').innerHTML='';if(pos>=order.length){$('hint').textContent=`完成！本轮正确 ${correct}/${total}。`; $('stats').textContent=`正确率：${total?Math.round(correct/total*100):0}% · 错题累计 ${missed.size}`;return}let d=data[order[pos]], opts=shuffle(d.slice(1).map((t,i)=>({t,i})));opts.forEach(o=>{let b=document.createElement('button');b.className='choice';b.textContent=o.t;b.onclick=()=>choose(o.i,b);$('choices').appendChild(b)});$('hint').textContent='请先听声音，再选择正确的中文意思。';$('stats').textContent=`第 ${pos+1}/${order.length} 题 · 本轮正确 ${correct}/${total} · 累计错题 ${missed.size}`;}function choose(i,button){if(answered)return;answered=true;total++;let d=data[order[pos]],ok=i===0;if(ok){correct++;missed.delete(order[pos])}else missed.add(order[pos]);document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent===d[1])b.classList.add('correct')});if(!ok)button.classList.add('wrong');$('feedback').classList.remove('hidden');$('feedback').innerHTML=`<strong>${ok?'✅ 正确！':'❌ 再练习一下'}</strong><div>英文：${d[0]}</div><div>中文：${d[1]}</div>`;$('next').disabled=false;$('stats').textContent=`第 ${pos+1}/${order.length} 题 · 本轮正确 ${correct}/${total} · 累计错题 ${missed.size}`;}function voices(){let list=speechSynthesis.getVoices(),select=$('voice'),old=select.value;select.innerHTML='<option value="">自动选择美式英语</option>';list.forEach((v,i)=>{if(v.lang.toLowerCase().startsWith('en')){let o=document.createElement('option');o.value=v.name+'|'+v.lang;o.textContent=v.name+' ('+v.lang+')';select.appendChild(o)}});select.value=old}function speak(){if(!('speechSynthesis'in window)){alert('当前浏览器不支持语音朗读，请使用 Safari、Chrome 或 Edge。');return}if(pos>=order.length)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(data[order[pos]][0]);u.lang='en-US';u.rate=Number($('rate').value);let vs=speechSynthesis.getVoices(),choice=$('voice').value;u.voice=vs.find(v=>v.name+'|'+v.lang===choice)||vs.find(v=>v.lang==='en-US')||null;speechSynthesis.speak(u)}$('speak').onclick=speak;$('repeat').onclick=speak;$('next').onclick=()=>{pos++;render()};$('restart').onclick=()=>{missed.clear();setup()};$('wrongOnly').onclick=()=>{if(!missed.size){alert('目前没有错题。请先做几道题。');return}setup(true)};speechSynthesis.onvoiceschanged=voices;voices();setup();</script></body></html>
